<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leon's Bits & Bytes — Leon's Online Marketplace & 360° Flagship Stores</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      line-height: 1.45;
    }
    img { max-width: 100%; display: block; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }

    /* Layout Helpers */
    .container { max-width: 1380px; margin: 0 auto; padding: 18px 22px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .grid-5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 12px; }
    .grid-6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .flex-between { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .flex-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    /* Backgrounds */
    .hero-bg {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 14%, rgba(250, 204, 21, 0.25) 0 10%, transparent 28%),
        radial-gradient(circle at 86% 85%, rgba(236, 72, 153, 0.22) 0 10%, transparent 30%),
        linear-gradient(135deg, #0c2942 0%, #174c70 52%, #24677a 100%);
      color: #ffffff;
      padding: 32px 20px 60px;
    }
    .topbar-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #6d28d9 100%);
      color: #ffffff;
      padding: 16px 24px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.22);
    }

    /* Brand Lockup */
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 14px 24px 14px 14px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.14);
      border: 2px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      margin-bottom: 16px;
    }
    .brand-avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #facc15;
      object-fit: contain;
      padding: 4px;
      flex-shrink: 0;
    }
    .brand-title { font-size: clamp(1.8rem, 4vw, 3.1rem); font-weight: 800; margin: 0; line-height: 1.1; }
    .brand-sub { color: #fde68a; font-weight: 700; letter-spacing: 0.12em; font-size: 0.98rem; margin: 4px 0 0; }

    /* Portfolio Showcase Cards */
    .portfolio-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .portfolio-card:hover {
      transform: translateY(-3px);
      border-color: #fde68a;
      background: rgba(15, 23, 42, 0.78);
    }
    .portfolio-card.active-demo {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border: 2px solid #facc15;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    /* Cards & Store Plaques */
    .card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 18px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.16);
    }
    .store-sign-plaque {
      height: 170px;
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f1f5f9 100%);
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      position: relative;
    }
    .store-sign-plaque img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.14));
    }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.95; }
    .btn-primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #ffffff; }
    .btn-amber { background: #facc15; color: #0f172a; }
    .btn-green { background: #10b981; color: #ffffff; }
    .btn-red { background: #ef4444; color: #ffffff; }
    .btn-light { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; }
    .btn-dark { background: #1e293b; color: #ffffff; }
    .btn-bank { background: linear-gradient(135deg, #0f172a, #1e40af); color: #fde68a; border: 1px solid rgba(250, 204, 21, 0.45); }
    .btn-full { width: 100%; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .badge-pink { background: #fce7f3; color: #be185d; }
    .badge-indigo { background: #e0e7ff; color: #4338ca; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-amber { background: #fef3c7; color: #92400e; }

    /* Form Inputs */
    .input, .select, .textarea {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.88rem;
      background: #ffffff;
      color: #0f172a;
    }
    .input:focus, .select:focus, .textarea:focus { outline: none; border-color: #4f46e5; }
    .label { display: block; font-size: 0.74rem; font-weight: 700; color: #475569; margin-bottom: 4px; }

    /* Emoji Character Picker Grid */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 6px;
      max-height: 185px;
      overflow-y: auto;
      padding: 8px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
    }
    .emoji-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: #ffffff;
      font-size: 1.45rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .emoji-btn:hover { transform: scale(1.1); border-color: #818cf8; }
    .emoji-btn.selected {
      border-color: #4f46e5;
      background: #eef2ff;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    /* Custom Video Player Banner */
    .logo-video-bar {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      border-bottom: 3px solid rgba(250, 204, 21, 0.45);
      padding: 14px 24px;
    }
    .video-bar-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 20px;
      align-items: center;
    }
    @media (max-width: 900px) {
      .video-bar-grid { grid-template-columns: 1fr; }
    }
    .custom-player-shell {
      background: #020617;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
    }
    .player-stage {
      position: relative;
      width: 100%;
      height: 210px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .player-stage video, .player-stage canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .player-controls {
      background: #0f172a;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .player-scrubber {
      flex: 1;
      height: 7px;
      border-radius: 999px;
      background: #334155;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .player-scrubber-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #facc15, #ec4899);
      border-radius: 999px;
    }

    /* Up-Front & Center Split Stage */
    .split-stage {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 20px;
      align-items: stretch;
    }
    .split-stage.single-col {
      grid-template-columns: 1fr;
    }
    @media (max-width: 1040px) {
      .split-stage { grid-template-columns: 1fr; }
    }

    .store-3d-viewport {
      position: relative;
      width: 100%;
      height: 615px;
      border-radius: 20px;
      overflow: hidden;
      background: #0f172a;
      border: 2px solid #cbd5e1;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
    }
    .store-3d-viewport.tall { height: 700px; }

    .menu-front-panel {
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #e2e8f0;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.1);
      display: flex;
      flex-direction: column;
      height: 615px;
      overflow: hidden;
    }
    .menu-front-panel.full-height {
      height: auto;
      min-height: 540px;
    }
    .menu-scroll-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .hud-overlay {
      position: absolute;
      z-index: 10;
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(10px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 13px;
      padding: 8px 11px;
    }
    .inspector-box {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 300px;
      max-width: calc(100% - 28px);
      z-index: 20;
      background: #ffffff;
      color: #0f172a;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      border: 2px solid #4f46e5;
    }

    /* CSS 3D Fallback Room */
    .css-3d-room {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 74px 16px 64px;
      background: radial-gradient(circle at 50% 35%, var(--wall-color, #fdf2f8) 0%, #1e293b 100%);
      overflow-y: auto;
    }
    .room-stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .station-pod {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      padding: 12px;
      border-top: 4px solid var(--accent-color, #db2777);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
    }

    /* Floating Basket & Chat Drawer */
    .floating-basket {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 350px;
      max-width: calc(100vw - 40px);
      max-height: 450px;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.34);
      border: 2px solid #4f46e5;
      z-index: 70;
    }
    .chat-fab {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 65;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 2px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.42);
    }
    .drawer-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 410px;
      max-width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 85;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 95;
      overflow-y: auto;
    }
    .modal-card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 22px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.42);
      border: 2px solid #cbd5e1;
    }

    /* Leon's Bank Credit Card Visual */
    .leons-bank-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 52%, #312e81 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 18px 20px;
      border: 1px solid rgba(250, 204, 21, 0.55);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.35);
      position: relative;
      overflow: hidden;
    }
    .card-chip {
      width: 38px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #fde68a, #d97706);
      border: 1px solid rgba(255,255,255,0.4);
    }

    /* Accounting Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    .data-table th {
      background: #f1f5f9;
      color: #334155;
      text-align: left;
      padding: 9px 12px;
      font-weight: 800;
      border-bottom: 2px solid #cbd5e1;
    }
    .data-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 18px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.86rem;
      z-index: 120;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
  </style>
</head>

    function safeStorageGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      try {
        const winStore = JSON.parse(window.name || '{}');
        if (winStore && Object.prototype.hasOwnProperty.call(winStore, key)) {
          return winStore[key];
        }
      } catch (e) {}
      return fallback;
    }

    function safeStorageSet(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
      try {
        const winStore = JSON.parse(window.name || '{}');
        winStore[key] = val;
        window.name = JSON.stringify(winStore);
      } catch (e) {}
    }

    /* =========================================================================
       INDEXEDDB PRODUCT VIDEO SHOWCASE STORAGE (.MP4 / .WEBM / .MOV + DIRECT URL)
       ========================================================================= */
    const VIDEO_DB_NAME = 'LeonsProductVideosDB_v1';
    const VIDEO_STORE_NAME = 'product_videos';
    let activeProductBlobUrls = [];

    function openProductVideoDB() {
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const req = indexedDB.open(VIDEO_DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(VIDEO_STORE_NAME)) {
            const os = db.createObjectStore(VIDEO_STORE_NAME, { keyPath: 'id' });
            os.createIndex('storeId', 'storeId', { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveProductVideoFiles(storeId, fileList) {
      const validFiles = Array.from(fileList || []).filter(f =>
        /\.(mp4|webm|mov)$/i.test(f.name) || ['video/mp4', 'video/webm', 'video/quicktime'].includes(f.type)
      );
      if (validFiles.length === 0) return 0;
      const db = await openProductVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(VIDEO_STORE_NAME, 'readwrite');
        const store = tx.objectStore(VIDEO_STORE_NAME);
        validFiles.forEach((file, idx) => {
          store.put({
            id: `vid_${storeId}_${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`,
            storeId: Number(storeId),
            name: file.name,
            mimeType: file.type || 'video/mp4',
            size: file.size,
            blob: file,
            createdAt: Date.now() + idx
          });
        });
        tx.oncomplete = () => resolve(validFiles.length);
        tx.onerror = () => reject(tx.error);
      });
    }

        name: u.title || `Direct Video #${i + 1}`,
        src: u.url,
        rawUrl: u.url,
        sourceKind: 'url'
      }));

      try {
        const db = await openProductVideoDB();
        const dbItems = await new Promise((resolve, reject) => {
          const tx = db.transaction(VIDEO_STORE_NAME, 'readonly');
          const idx = tx.objectStore(VIDEO_STORE_NAME).index('storeId');
          const req = idx.getAll(Number(storeId));
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });

        activeProductBlobUrls.forEach(u => {
          try { URL.revokeObjectURL(u); } catch (e) {}
        });
        activeProductBlobUrls = [];

        const blobEntries = dbItems
          .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
          .map(item => {
            const blobUrl = URL.createObjectURL(item.blob);
            activeProductBlobUrls.push(blobUrl);
            return {
              id: item.id,
              storeId: Number(storeId),
              name: item.name,
              size: item.size || 0,
              src: blobUrl,
              sourceKind: 'indexeddb'
            };
          });

        return [...blobEntries, ...urlEntries];
      } catch (e) {
        return urlEntries;
      }
    }

        saveStoreCustomization(storeId, { productShowcaseUrls: nextUrls });

      const db = await openProductVideoDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(VIDEO_STORE_NAME, 'readwrite');
        tx.objectStore(VIDEO_STORE_NAME).delete(itemId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function initProductVideoShowcase(storeId) {
      const vid = document.getElementById('product-showcase-video');
      const emptyEl = document.getElementById('product-showcase-empty');
      const titleEl = document.getElementById('product-showcase-active-title');
      const pillsEl = document.getElementById('product-showcase-pills');
      const playBtn = document.getElementById('product-showcase-play-btn');
      if (!vid || !emptyEl || !pillsEl) return;

      let playlist = await getProductVideosForStore(storeId);
      if (!playlist || playlist.length === 0) {
        const storeSpecific = DEFAULT_STORE_SHOWCASE_VIDEOS[storeId];
        playlist = (Array.isArray(storeSpecific) && storeSpecific.length > 0)
          ? storeSpecific
          : (DEFAULT_STORE_SHOWCASE_VIDEOS.default || []);
      }
      window.__productPlaylist = playlist;
      window.__productPlaylistIdx = 0;

      if (playlist.length === 0) {
        vid.pause();
        vid.removeAttribute('src');
        vid.style.display = 'none';
        emptyEl.style.display = 'block';
        if (titleEl) titleEl.textContent = 'Continuous-Loop Product Showcase (Upload .mp4 / .webm / .mov or URL)';
        pillsEl.innerHTML = '';
        return;
      }

      emptyEl.style.display = 'none';
      vid.style.display = 'block';

      const playIndex = (idx) => {
        const safeIdx = ((idx % playlist.length) + playlist.length) % playlist.length;
        window.__productPlaylistIdx = safeIdx;
        const item = playlist[safeIdx];
        vid.src = item.src;
        vid.loop = playlist.length === 1;
        vid.play().then(() => {
          if (playBtn) playBtn.textContent = '⏸ Pause';
        }).catch(() => {
          if (playBtn) playBtn.textContent = '▶ Play';
        });
        if (titleEl) {
          titleEl.textContent = `${item.name} (${safeIdx + 1} of ${playlist.length} · Continuous Loop)`;
        }
        pillsEl.innerHTML = playlist.map((p, i) => `
          <button class="btn ${i === safeIdx ? 'btn-amber' : 'btn-dark'}" style="padding:4px 10px;font-size:0.74rem;"
            onclick="window.__app.selectProductShowcaseClip(${i})">
            ${i === safeIdx ? '▶' : '🎞️'} ${escapeHtml(p.name)}
          </button>
        `).join('');
      };

      vid.onended = () => playIndex(window.__productPlaylistIdx + 1);
      vid.onerror = () => {
        if (playlist.length > 1) playIndex(window.__productPlaylistIdx + 1);
      };
      playIndex(0);
    }

    function ensureStoreInventory(storeId) {
      let existing = allData.filter(d => d.type === 'inventory' && d.category === String(storeId));
      if (storeId === 6 && existing.some(i => i.name === 'Phone Case Premium')) {
        existing.forEach(oldItem => dbDelete(oldItem));
        existing = [];
      }
      if (existing.length > 0) {
        if (storeId === 1) {
          existing.forEach(it => {
            if (it.name === 'Beauty Consultation' && it.imageUrl !== BEAUTY_CONSULTATION_PHOTO_URL) {
              dbUpdate({ ...it, imageUrl: BEAUTY_CONSULTATION_PHOTO_URL });
            }
          });
        }
        if (storeId === 6) {
          const starters6 = STARTER_PRODUCTS[6] || [];
          existing.forEach(it => {
            const match = starters6.find(s => s.name === it.name);
            if (match && (
              Number(it.retailPrice) !== Number(match.price) ||
              (it.veiBuyUrl || '') !== (match.veiBuyUrl || '') ||
              it.stallId !== (match.stallId || 'reception')
            )) {
              dbUpdate({
                ...it,
                retailPrice: Number(match.price),
                costPrice: Number(match.cost),
                stallId: match.stallId || 'reception',
                station: match.station || '',
                veiBuyUrl: match.veiBuyUrl || ''
              });
            }
          });
        }
        return;
      }
      const starters = STARTER_PRODUCTS[storeId] || [];
      starters.forEach(p => {
        dbCreate({
          type: 'inventory',
          category: String(storeId),
          name: p.name,
          description: p.desc,
          imageUrl: p.image,
          offeringType: p.offeringType || 'product',
          categoryGroup: p.categoryGroup || '',
          priceDisplay: p.priceDisplay || '',
          stallId: p.stallId || 'reception',
          station: p.station || '',
          portfolioId: p.portfolioId || '',
          veiBuyUrl: p.veiBuyUrl || '',
          costPrice: p.cost,
          retailPrice: p.price,
          bom: p.bom ? JSON.parse(JSON.stringify(p.bom)) : [{ material: 'Standard Supply Kit', qty: 1, unitCost: p.cost }],
          unitsSold: 0
        });
      });
    }

    function buildEquirectangularRoomTexture(sources, accentColor) {
      const cv = document.createElement('canvas');
      cv.width = 2048;
      cv.height = 1024;
      const ctx = cv.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 0, 1024);
      bg.addColorStop(0, '#0f172a');
      bg.addColorStop(0.5, accentColor || '#1e3a8a');
      bg.addColorStop(1, '#0f172a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 2048, 1024);

      const tex = new THREE.CanvasTexture(cv);
      tex.needsUpdate = true;

      const tryLoad = (idx) => {
        if (idx >= sources.length) return;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          ctx.drawImage(img, 0, 0, 1024, 1024);
          ctx.save();
          ctx.translate(2048, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0, 1024, 1024);
          ctx.restore();

          const poleGrad = ctx.createLinearGradient(0, 0, 0, 1024);
          poleGrad.addColorStop(0, 'rgba(15, 23, 42, 0.48)');
          poleGrad.addColorStop(0.18, 'rgba(15, 23, 42, 0.0)');
          poleGrad.addColorStop(0.82, 'rgba(15, 23, 42, 0.0)');
          poleGrad.addColorStop(1, 'rgba(15, 23, 42, 0.58)');
          ctx.fillStyle = poleGrad;
          ctx.fillRect(0, 0, 2048, 1024);

          tex.needsUpdate = true;
        };
        img.onerror = () => tryLoad(idx + 1);
        img.src = sources[idx];
      };

      tryLoad(0);
      return tex;
    }

    function wrapCanvasLines(ctx, text, maxWidth) {
      const words = String(text || '').split(' ');
      const lines = [];
      let current = '';
      words.forEach(w => {
        const test = current ? `${current} ${w}` : w;
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = w;
        } else {
          current = test;
        }
      });
      if (current) lines.push(current);
      return lines;
    }

    function drawOverheadConsoleCanvas(canvas, store, skin, specialist, clientProfile, totalSelectedCount, totalSelectedAmount) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(26, 26, 36, 0.95)';
      ctx.beginPath();
      ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 22);
      ctx.fill();

      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.fillStyle = '#f1c40f';
      ctx.font = 'bold 19px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${store.name.toUpperCase()} · ${skin.roomBadge}`, 28, 46);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#2ecc71';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`BASKET: ${totalSelectedCount} ITEM(S) · $${totalSelectedAmount.toFixed(2)}`, canvas.width - 28, 46);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#fde68a';
      ctx.font = 'bold 19px sans-serif';
      const specLine = store.isSalon
        ? `${specialist ? specialist.emoji + ' ' + specialist.employeeName : ''}   |   Client: ${clientProfile.avatar} ${clientProfile.name}`
        : `${specialist ? specialist.emoji + ' Specialist on Duty: ' + specialist.employeeName + ' (' + specialist.title + ')' : store.tagline}`;
      ctx.fillText(specLine.slice(0, 82), 28, 86);

      ctx.fillStyle = '#ffffff';
      ctx.font = '600 19px sans-serif';
      const lines = wrapCanvasLines(ctx, skin.prompt, canvas.width - 56);
      lines.slice(0, 2).forEach((ln, i) => {
        ctx.fillText(ln, 28, 124 + i * 28);
      });
    }

    function truncateCanvasText(ctx, text, maxWidth) {
      const str = String(text || '').trim();
      if (ctx.measureText(str).width <= maxWidth) return str;
      const words = str.split(' ');
      let out = '';
      for (let i = 0; i < words.length; i++) {
        const next = out ? `${out} ${words[i]}` : words[i];
        if (ctx.measureText(`${next}...`).width > maxWidth) {
          return out ? `${out}...` : `${str.slice(0, 28)}...`;
        }
        out = next;
      }
      return out;
    }

    function drawOptionBarCanvas(
      canvas, letter, slotData, isSelected, isHovered, thumbImg
    ) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!slotData) return;

      const isRoomPortal = slotData.kind === 'roomJump';
      ctx.fillStyle = isSelected
        ? 'rgba(39, 174, 96, 0.96)'
        : (isHovered
          ? 'rgba(79, 70, 229, 0.96)'
          : (isRoomPortal ? 'rgba(30, 58, 138, 0.94)' : 'rgba(30, 41, 59, 0.95)'));
      ctx.beginPath();
      ctx.roundRect(6, 6, canvas.width - 12, canvas.height - 12, 18);
      ctx.fill();

      ctx.strokeStyle = isSelected
        ? '#a7f3d0'
        : (isHovered ? '#fde68a' : (isRoomPortal ? '#93c5fd' : 'rgba(255,255,255,0.28)'));
      ctx.lineWidth = isSelected || isHovered ? 5 : 3;
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#fde68a';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText(`${letter})`, 24, 64);

      if (isRoomPortal) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 25px sans-serif';
        const t1 = truncateCanvasText(ctx, `${slotData.icon} ${slotData.title}`, 640);
        ctx.fillText(t1, 74, 50);

        ctx.fillStyle = '#dbeafe';
        ctx.font = '20px sans-serif';
        ctx.fillText(truncateCanvasText(ctx, slotData.desc, 640), 74, 84);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#fde68a';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('WALK TO ROOM ->', canvas.width - 28, 66);
      } else {
        const service = slotData.service;
        const tx = 72, ty = 14, tw = 116, th = 82;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, th, 12);
        ctx.clip();
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(tx, ty, tw, th);
        if (thumbImg && thumbImg.complete && thumbImg.naturalWidth > 0) {
          const sc = Math.max(tw / thumbImg.naturalWidth, th / thumbImg.naturalHeight);
          const dw = thumbImg.naturalWidth * sc;
          const dh = thumbImg.naturalHeight * sc;
          ctx.drawImage(thumbImg, tx + (tw - dw) / 2, ty + (th - dh) / 2, dw, dh);
        }
        ctx.restore();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, th, 12);
        ctx.stroke();

        const textX = tx + tw + 16;
        const maxTextW = 555;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        const titleLabel = service.categoryGroup
          ? `${service.name} [${service.categoryGroup}]`
          : service.name;
        ctx.fillText(truncateCanvasText(ctx, titleLabel, maxTextW), textX, 50);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '19px sans-serif';
        const descText = truncateCanvasText(ctx, service.description || '', maxTextW);
        ctx.fillText(descText, textX, 84);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px sans-serif';
        const priceStr = service.priceDisplay
          || `$${Number(service.retailPrice).toFixed(2)}`;
        ctx.fillText(priceStr, canvas.width - 28, 52);

        ctx.fillStyle = isSelected ? '#ffffff' : '#6ee7b7';
        ctx.font = 'bold 18px sans-serif';
        const cta = isSelected ? 'IN BASKET (CLICK +1)' : 'CLICK TO SELECT';
        ctx.fillText(cta, canvas.width - 28, 84);
      }
    }

    function drawDeskFeedbackCanvas(canvas, message, colorHex) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(15, 15, 20, 0.96)';
      ctx.beginPath();
      ctx.roundRect(6, 6, canvas.width - 12, canvas.height - 12, 16);
      ctx.fill();

      ctx.strokeStyle = colorHex || '#f1c40f';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = colorHex || '#f1c40f';
      ctx.font = 'bold 22px sans-serif';
      const lines = wrapCanvasLines(ctx, message, canvas.width - 48);
      if (lines.length === 1) {
        ctx.fillText(lines[0], canvas.width / 2, 68);
      } else {
        ctx.fillText(lines[0], canvas.width / 2, 48);
        ctx.fillText(lines[1], canvas.width / 2, 84);
      }
    }

    function drawNavButtonCanvas(canvas, label, isHovered, isSecondary = false) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = isHovered
        ? (isSecondary ? 'rgba(250, 204, 21, 0.96)' : 'rgba(16, 185, 129, 0.98)')
        : (isSecondary ? 'rgba(30, 58, 138, 0.92)' : 'rgba(6, 78, 59, 0.94)');
      ctx.beginPath();
      ctx.roundRect(6, 6, canvas.width - 12, canvas.height - 12, 18);
      ctx.fill();

      ctx.strokeStyle = isSecondary ? '#facc15' : '#6ee7b7';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = isHovered
        ? '#0f172a'
        : (isSecondary ? '#fde68a' : '#ffffff');
      ctx.font = 'bold 23px sans-serif';
      ctx.fillText(label, canvas.width / 2, 52);
    }

    function createQuadcopterDrone(accentHex, scale = 1) {
      const drone = new THREE.Group();
      drone.scale.setScalar(scale);

      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        metalness: 0.65,
        roughness: 0.25
      });
      const canopyMat = new THREE.MeshStandardMaterial({

    function buildThemeAtmosphericProps(scene, storeId) {
      const propGroup = new THREE.Group();
      scene.add(propGroup);

      const ambLight = new THREE.AmbientLight(0xffffff, 1.15);
      propGroup.add(ambLight);
      const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
      keyLight.position.set(3, 6, 4);
      propGroup.add(keyLight);

      if (storeId === 2) {
        const droneConfigs = [
          { color: 0x38bdf8, radiusX: 4.4, radiusZ: 3.8, baseY: 2.85, speed: 0.68, phase: 0.0,  scale: 1.05 },
          { color: 0x8b5cf6, radiusX: 5.2, radiusZ: 4.5, baseY: 3.35, speed: -0.54, phase: 1.25, scale: 0.95 },
          { color: 0xfacc15, radiusX: 3.9, radiusZ: 4.8, baseY: 2.35, speed: 0.82, phase: 2.5,  scale: 0.90 },
          { color: 0x10b981, radiusX: 5.8, radiusZ: 4.1, baseY: 3.65, speed: 0.48, phase: 3.75, scale: 1.10 },
          { color: 0xf43f5e, radiusX: 4.7, radiusZ: 5.3, baseY: 2.60, speed: -0.74, phase: 5.0, scale: 0.92 }
        ];

        const drones = droneConfigs.map(cfg => {
          const unit = createQuadcopterDrone(cfg.color, cfg.scale);
          propGroup.add(unit.group);
          return { ...unit, cfg };
        });

        return {
          update(t = 0) {
            drones.forEach((d, idx) => {
              const { radiusX, radiusZ, baseY, speed, phase } = d.cfg;
              const angle = t * speed + phase;
              const nextAngle = angle + (speed >= 0 ? 0.05 : -0.05);

              const x = Math.cos(angle) * radiusX;
              const z = Math.sin(angle) * radiusZ - 1.2;
              const y = baseY + Math.sin(t * 1.9 + phase) * 0.34;
              d.group.position.set(x, y, z);

              const nx = Math.cos(nextAngle) * radiusX;
              const nz = Math.sin(nextAngle) * radiusZ - 1.2;
              d.group.lookAt(nx, y, nz);
              d.group.rotateZ(speed >= 0 ? -0.18 : 0.18);
              d.group.rotateX(0.10);

              d.propellers.forEach(p => {
                p.mesh.rotation.y += p.dir * 0.62;
              });

              const navPulse = Math.sin(t * 7.5 + idx * 1.3) > 0;
              const strobeFlash = ((t * 2.4 + idx * 0.37) % 1) < 0.16;
              d.leds.portLed.visible = navPulse;
              d.leds.stbdLed.visible = navPulse;
              d.leds.strobeLed.visible = strobeFlash;
              d.leds.strobeLed.scale.setScalar(strobeFlash ? 1.45 : 0.7);
            });
          }
        };
      }

      const palettes = {
        1: [0xfacc15, 0xf472b6],
        3: [0x38bdf8, 0xfacc15],
        4: [0x10b981, 0x22d3ee],
        5: [0xf472b6, 0xfde68a],
        6: [0x818cf8, 0xfacc15]
      };
      const palette = palettes[storeId] || [0x818cf8, 0xfacc15];
      const spinners = [];

      for (let i = 0; i < 4; i++) {
        const gem = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.20, 0),
          new THREE.MeshBasicMaterial({ color: palette[i % 2], wireframe: true })
        );
        const side = i < 2 ? -2.45 : 2.45;
        const yPos = i % 2 === 0 ? 2.45 : 0.95;
        gem.position.set(side, yPos, -3.2);
        propGroup.add(gem);
        spinners.push(gem);
      }

      return {
        update() {
          spinners.forEach((sp, i) => {
            sp.rotation.y += 0.02 + i * 0.004;
            sp.rotation.x += 0.012;
          });
        }
      };
    }

      let feedbackColor = '#f1c40f';

      let roomPage = 0;
      const thumbCache = new Map();
      function getConsoleThumbImage(url, fallbackUrl) {
        const key = url || fallbackUrl || '';
        if (!key) return null;
        if (thumbCache.has(key)) return thumbCache.get(key);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => refreshConsoleUI();
        img.onerror = () => {
          if (fallbackUrl && img.src !== fallbackUrl) img.src = fallbackUrl;
        };
        img.src = key;
        thumbCache.set(key, img);
        return img;
      }

      function getRoomMatchedServices(skin) {
        const allStoreItems = allData.filter(d => d.type === 'inventory' && d.category === String(storeId));
        const starterNames = new Set(skin.serviceNames || []);
        const customAdded = allStoreItems
          .filter(it => it.stallId === skin.stallId && (it.isCustomAdded || !starterNames.has(it.name)))
          .reverse(); // Most recently added appears first on Slot A

        const matchedServices = [...customAdded];

        (skin.serviceNames || []).forEach(nm => {
          const found = allStoreItems.find(it => it.name === nm);
          if (found && !matchedServices.includes(found)) matchedServices.push(found);
        });

        allStoreItems.forEach(it => {
          if (it.stallId === skin.stallId && !matchedServices.includes(it)) {
            matchedServices.push(it);
          }
        });

        return matchedServices;
      }

      function buildRoomSlots(skin) {
        const matchedServices = getRoomMatchedServices(skin);
        const totalPages = Math.max(1, Math.ceil(matchedServices.length / 3));
        const safePage = roomPage % totalPages;
        const visibleServices = matchedServices.slice(safePage * 3, safePage * 3 + 3);

        const slots = visibleServices.map(svc => ({ kind: 'service', service: svc }));

        if (slots.length < 3 && Array.isArray(skin.roomJumpOptions)) {
          skin.roomJumpOptions.forEach(jump => {
            if (slots.length < 3) {
              slots.push({ kind: 'roomJump', ...jump });
            }
          });
        }

        while (slots.length < 3) slots.push(null);
        return slots;
      }

      function refreshConsoleUI() {
        const skin = storeSkins[salonStationIdx] || storeSkins[0];
        const specialist = roster.find(r => r.stallId === skin.stallId) || roster[0];
        const clientProfile = SALON_CLIENT_PROFILES[activeSalonClientIdx] || SALON_CLIENT_PROFILES[0];
        const { count, subtotal } = getBasketTotals();
        const slots = buildRoomSlots(skin);

        drawOverheadConsoleCanvas(overheadCv, store, skin, specialist, clientProfile, count, subtotal);
        overheadTex.needsUpdate = true;

        const letters = ['A', 'B', 'C'];
        for (let i = 0; i < 3; i++) {
          const slot = slots[i];
          optionSlots[i] = slot;
          const isSelected = slot && slot.kind === 'service'
            && basketItems.some(b => b.product.__backendId === slot.service.__backendId);
          const isHov = hoveredObj === optionMeshes[i];
          const thumbImg = (slot && slot.kind === 'service')
            ? getConsoleThumbImage(slot.service.imageUrl, store.storeImage)
            : null;
          drawOptionBarCanvas(
            optionCanvases[i], letters[i], slot, isSelected, isHov, thumbImg
          );
          optionTextures[i].needsUpdate = true;
        }

        drawDeskFeedbackCanvas(deskCv, feedbackMsg, feedbackColor);
        deskTex.needsUpdate = true;

        drawNavButtonCanvas(navCv, skin.nextLabel, hoveredObj === navMesh, false);
        navTex.needsUpdate = true;

        const matchedCount = getRoomMatchedServices(skin).length;
        const totalPages = Math.max(1, Math.ceil(matchedCount / 3));
        const isAtReception = skin.stallId === 'reception';
        const auxLabel = totalPages > 1
          ? `🔄 MORE ITEMS (${(roomPage % totalPages) + 1}/${totalPages})`
          : (isAtReception ? '🖥️ OPEN POS REGISTER' : '🖥️ GO TO POS DESK');
        drawNavButtonCanvas(auxCv, auxLabel, hoveredObj === auxMesh, true);
        auxTex.needsUpdate = true;
      }

      function loadStation(idx, targetBackendId = null) {
        const n = storeSkins.length;
        salonStationIdx = ((idx % n) + n) % n;
        const skin = storeSkins[salonStationIdx];
        if (targetBackendId) {
          const matched = getRoomMatchedServices(skin);
          const itemPos = matched.findIndex(m => m.__backendId === targetBackendId);
          roomPage = itemPos >= 0 ? Math.floor(itemPos / 3) : 0;
        } else {
          roomPage = 0;
        }
        skyMat.map = buildEquirectangularRoomTexture([skin.photoUrl, skin.fallbackUrl], custom.accentColor);
        skyMat.needsUpdate = true;
        const clientProfile = SALON_CLIENT_PROFILES[activeSalonClientIdx] || SALON_CLIENT_PROFILES[0];
        feedbackMsg = store.isSalon
          ? `${skin.label} · ${clientProfile.note}`
          : `${skin.label} · Select an offering from A/B/C above or explore all 5 rooms!`;
        feedbackColor = '#f1c40f';
        refreshConsoleUI();
      }

      let yaw = 0;
      let pitch = 0;
      let targetYaw = 0;
      let targetPitch = 0;
      let isDragging = false;
      let prevX = 0;
      let prevY = 0;
      let dragDist = 0;

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      const updatePointer = (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      };

      const onDown = (e) => {
        isDragging = true;
        dragDist = 0;
        prevX = e.clientX;
        prevY = e.clientY;
      };

      const onMove = (e) => {
        updatePointer(e);
        if (isDragging) {
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          dragDist += Math.abs(dx) + Math.abs(dy);
          yaw -= dx * 0.0045;
          pitch = Math.max(-0.65, Math.min(0.65, pitch - dy * 0.0035));
          targetYaw = yaw;
          targetPitch = pitch;
          prevX = e.clientX;
          prevY = e.clientY;
        } else {
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(clickableObjects);
          const nextHover = hits.length > 0 ? hits[0].object : null;
          if (nextHover !== hoveredObj) {
            hoveredObj = nextHover;
            renderer.domElement.style.cursor = hoveredObj ? 'pointer' : 'grab';
            refreshConsoleUI();
          }
        }
      };

      const onUp = (e) => {
        isDragging = false;
        if (dragDist < 7) {
          updatePointer(e);
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(clickableObjects);
          if (hits.length > 0) {
            const hit = hits[0].object;
            if (hit.userData.type === 'option') {
              const slot = optionSlots[hit.userData.index];
              if (!slot) return;
              if (slot.kind === 'roomJump') {
                loadStation(slot.targetIdx);
                targetYaw = 0;
                targetPitch = 0;
                render();
                return;
              }
              const svc = slot.service;
              if (svc) {
                const existing = basketItems.find(b => b.product.__backendId === svc.__backendId);
                if (existing) existing.qty += 1;
                else basketItems.push({ product: svc, qty: 1 });

                const { subtotal } = getBasketTotals();
                const priceTag = svc.priceDisplay || `$${Number(svc.retailPrice).toFixed(2)}`;
                feedbackMsg = `ADDED: ${svc.name} (${priceTag}) · Total Due at POS: $${subtotal.toFixed(2)}`;
                feedbackColor = '#2ecc71';
                refreshConsoleUI();
                syncFloatingBasket();
                showToast(`Selected "${svc.name}" (${priceTag})`);
              }
            } else if (hit.userData.type === 'nav') {
              const skin = storeSkins[salonStationIdx] || storeSkins[0];
              loadStation(skin.nextIdx);
              targetYaw = 0;
              targetPitch = 0;
              render();
            } else if (hit.userData.type === 'aux') {
              const skin = storeSkins[salonStationIdx] || storeSkins[0];
              const matchedCount = getRoomMatchedServices(skin).length;
              const totalPages = Math.max(1, Math.ceil(matchedCount / 3));
              const receptionIdx = storeSkins.findIndex(s => s.stallId === 'reception');
              if (totalPages > 1) {
                roomPage = (roomPage + 1) % totalPages;
                feedbackMsg = `${skin.label} — Showing Page ${roomPage + 1} of ${totalPages} (${matchedCount} offerings)`;
                feedbackColor = '#fde68a';
                refreshConsoleUI();
              } else if (skin.stallId === 'reception' || receptionIdx < 0) {
                openPosModal('card');
              } else {
                roomPage = 0;
                loadStation(receptionIdx);
                targetYaw = 0;
                targetPitch = 0;
                render();
              }
            }
          }
        }
      };

      const dom = renderer.domElement;
      dom.style.cursor = 'grab';
      dom.addEventListener('pointerdown', onDown);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);

      loadStation(salonStationIdx);

      const startClock = performance.now();
      const animate = (now) => {
        const rafId = requestAnimationFrame(animate);
        if (threeEngine) threeEngine.rafId = rafId;

        const t = ((now || performance.now()) - startClock) * 0.001;
        atmosphericProps.update(t);

        if (!isDragging) {
          yaw += (targetYaw - yaw) * 0.08;
          pitch += (targetPitch - pitch) * 0.08;
        }

        const lookDir = new THREE.Vector3(
          -Math.sin(yaw) * Math.cos(pitch),
          Math.sin(pitch),
          -Math.cos(yaw) * Math.cos(pitch)
        );
        camera.lookAt(camera.position.clone().add(lookDir));

        renderer.render(scene, camera);
      };

      threeEngine = {
        rafId: null,
        refreshConsole() {
          refreshConsoleUI();
        },
        goToSalonStation(idx, targetBackendId = null) {
          loadStation(idx, targetBackendId);
          targetYaw = 0;
          targetPitch = 0;
        },
        updateClientProfile() {
          const clientProfile = SALON_CLIENT_PROFILES[activeSalonClientIdx] || SALON_CLIENT_PROFILES[0];
          feedbackMsg = clientProfile.note;
          feedbackColor = '#f1c40f';
          refreshConsoleUI();
        },
        recenter() {
          targetYaw = 0;
          targetPitch = 0;
        },
        cleanup() {
          dom.removeEventListener('pointerdown', onDown);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          renderer.dispose();
        }
      };

      animate(startClock);
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function initLogoVideoPlayer(storeId) {
      const custom = getStoreCustomization(storeId);
      const vid = document.getElementById('store-greeting-video');
      const playBtn = document.getElementById('player-play-btn');
      const fill = document.getElementById('player-scrubber-fill');
      const timeLabel = document.getElementById('player-time-label');

      if (custom.videoSourceType === 'mp4' && vid) {
        vid.addEventListener('timeupdate', () => {
          if (vid.duration && fill && timeLabel) {
            fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
            timeLabel.textContent = `${formatTime(vid.currentTime)} / ${formatTime(vid.duration)}`;
          }
        });
        vid.addEventListener('play', () => { if (playBtn) playBtn.textContent = '⏸ Pause'; });
        vid.addEventListener('pause', () => { if (playBtn) playBtn.textContent = '▶ Play'; });
        vid.play().catch(() => { if (playBtn) playBtn.textContent = '▶ Play'; });
      } else {
        startCanvasShowreel(storeId);
      }
    }

      const logoImg = new Image();
      logoImg.crossOrigin = 'anonymous';
      logoImg.src = store.storeImage;

      showreelStart = performance.now();
      showreelPaused = false;
      const playBtn = document.getElementById('player-play-btn');
      if (playBtn) playBtn.textContent = '⏸ Pause';

      const duration = 18;

      const draw = (now) => {
        showreelRaf = requestAnimationFrame(draw);
        if (showreelPaused) {
          showreelStart += 16.6;
          return;
        }
        const elapsed = ((now - showreelStart) / 1000) % duration;
        const fill = document.getElementById('player-scrubber-fill');
        const timeLabel = document.getElementById('player-time-label');
        if (fill) fill.style.width = `${(elapsed / duration) * 100}%`;
        if (timeLabel) timeLabel.textContent = `${formatTime(elapsed)} / 0:18`;

        const grad = ctx.createLinearGradient(0, 0, 840, 360);
        grad.addColorStop(0, '#090d16');
        grad.addColorStop(0.55, store.color);
        grad.addColorStop(1, store.accent);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 840, 360);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(24, 20, 792, 42);
        ctx.fillStyle = '#fde68a';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`● LEON'S ONLINE MARKETPLACE · ${store.name.toUpperCase()}`, 42, 46);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(`360° PHOTOGRAPHIC STORE · ${roster.length} SPECIALISTS ON DUTY`, 798, 46);

        const slide = Math.floor(elapsed / 6);
        ctx.textAlign = 'center';

        if (slide === 0) {
          if (logoImg.complete && logoImg.naturalWidth > 0) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(355, 76, 130, 86, 14);
            ctx.fill();
            ctx.drawImage(logoImg, 365, 82, 110, 74);
          }
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 25px sans-serif';
          ctx.fillText(custom.greetingHeadline.slice(0, 46), 420, 210);
          ctx.fillStyle = '#fde68a';
          ctx.font = '600 15px sans-serif';
          ctx.fillText(store.tagline.slice(0, 68), 420, 248);
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '15px sans-serif';
          ctx.fillText(`Supervised by ${roster[0]?.emoji || ''} ${roster[0]?.employeeName || 'Store Manager'} (${roster[0]?.title || 'Manager'})`, 420, 292);
        } else if (slide === 1) {
          ctx.fillStyle = '#fde68a';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText(store.isSalon ? 'DIVERSE BRONX STUDENT COSMETOLOGY TEAM' : 'MEET OUR STORE SPECIALISTS & CUSTOMER SERVICE TEAM', 420, 102);

          roster.slice(0, 4).forEach((emp, i) => {
            const bx = 65 + (i % 2) * 365;
            const by = 122 + Math.floor(i / 2) * 96;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(bx, by, 345, 80, 12);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 17px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`${emp.emoji}  ${emp.employeeName}`, bx + 16, by + 35);
            ctx.fillStyle = '#1e3a8a';
            ctx.font = '600 13px sans-serif';
            ctx.fillText(emp.title.slice(0, 36), bx + 16, by + 60);
          });
        } else {
          ctx.fillStyle = '#6ee7b7';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText(store.isSalon ? 'HAIR SERVICES • NAIL SERVICES • BEAUTY SERVICES' : 'FEATURED PRODUCTS & SERVICES', 420, 102);

          items.slice(0, 3).forEach((it, i) => {
            const by = 120 + i * 70;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.beginPath();
            ctx.roundRect(90, by, 660, 56, 12);
            ctx.fill();

            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(it.name.slice(0, 42), 112, by + 26);
            ctx.fillStyle = '#cbd5e1';
            ctx.font = '13px sans-serif';
            ctx.fillText(`${it.categoryGroup ? it.categoryGroup + ' · ' : ''}${it.station || store.name}`, 112, by + 45);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#fde68a';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(it.priceDisplay || `$${Number(it.retailPrice).toFixed(2)}`, 728, by + 35);
          });
        }
      };

      draw(showreelStart);
    }

      modal.className = 'modal-backdrop';
      modal.innerHTML = `<div class="modal-card" style="max-width:1040px;" id="studio-modal-body">${renderStudioBody()}</div>`;
      document.body.appendChild(modal);
      if (defaultTab === 'video') {
        refreshStudioProductVideoList(currentStoreId);
      }
    }

    /* =========================================================================
       THREE.JS 3D BOOTH ENGINE (OPTIONAL TOGGLE VIEW)
       ========================================================================= */
    function initStore3DScene(storeId) {
      if (typeof THREE === 'undefined') return;
      const wrap = document.getElementById('store-3d-wrap');
      if (!wrap) return;

      const store = STORE_CATEGORIES.find(s => s.id === storeId);
      const custom = getStoreCustomization(storeId);
      const items = allData.filter(d => d.type === 'inventory' && d.category === String(storeId));
      const roster = getStoreStaff(storeId);
      const W = wrap.clientWidth || 760;
      const H = wrap.clientHeight || 615;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
      } catch (e) {
        return;
      }

      const fallback = document.getElementById('css-3d-fallback-room');
      if (fallback) fallback.style.display = 'none';

      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.domElement.style.display = 'block';
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
      wrap.insertBefore(renderer.domElement, wrap.firstChild);

      const scene = new THREE.Scene();
      const boothDroneProps = storeId === 2 ? buildThemeAtmosphericProps(scene, storeId) : null;
      const boothClockStart = performance.now();
      const isDark = custom.lightingMood === 'neon';
      scene.background = new THREE.Color(isDark ? 0x090d16 : 0xe2e8f0);

      const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 100);
      camera.position.set(0, 2.3, 8.2);
      const camTarget = new THREE.Vector3(0, 1.7, 0);

      scene.add(new THREE.AmbientLight(0xffffff, isDark ? 0.65 : 0.95));
      const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
      keyLight.position.set(5, 10, 6);
      scene.add(keyLight);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 20),
        new THREE.MeshStandardMaterial({ color: isDark ? 0x1e293b : 0xf8fafc, roughness: 0.45 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(custom.wallColor), roughness: 0.85 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 6.2, 0.3), wallMat);
      backWall.position.set(0, 3.1, -9.8);
      scene.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6.2, 20), wallMat);
      leftWall.position.set(-7.9, 3.1, 0);
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6.2, 20), wallMat);
      rightWall.position.set(7.9, 3.1, 0);
      scene.add(rightWall);

      const makeSignTex = (title, sub, bgHex) => {
        const cv = document.createElement('canvas');
        cv.width = 512; cv.height = 160;
        const c = cv.getContext('2d');
        c.fillStyle = bgHex || '#1e293b';
        c.fillRect(0, 0, 512, 160);
        c.strokeStyle = '#fde68a';
        c.lineWidth = 6;
        c.strokeRect(8, 8, 496, 144);
        c.fillStyle = '#ffffff';
        c.font = 'bold 28px sans-serif';
        c.textAlign = 'center';
        c.fillText(title.slice(0, 26), 256, 70);
        c.fillStyle = '#fde68a';
        c.font = 'bold 21px sans-serif';
        c.fillText(sub.slice(0, 34), 256, 118);
        return new THREE.CanvasTexture(cv);
      };

      const banner = new THREE.Mesh(
        new THREE.PlaneGeometry(7.2, 1.8),
        new THREE.MeshBasicMaterial({ map: makeSignTex(store.name, `${roster.length} Specialists · POS Ready`, store.color) })
      );
      banner.position.set(0, 4.4, -9.55);
      scene.add(banner);

      const accentMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(custom.accentColor) });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const clickTargets = [];

      const stationCoords = [
        { x: -5.4, z: -3.0, rot: Math.PI / 2 },
        { x: -5.4, z: 2.4, rot: Math.PI / 2 },
        { x: 5.4, z: -3.0, rot: -Math.PI / 2 },
        { x: 5.4, z: 2.4, rot: -Math.PI / 2 },
        { x: 0, z: -6.2, rot: 0 }
      ];

      store.stalls.forEach((st, idx) => {
        const sc = stationCoords[idx] || stationCoords[0];
        const matched = items.filter(i => i.stallId === st.id);
        const stallItems = [
          ...matched.filter(i => i.isCustomAdded).reverse(),
          ...matched.filter(i => !i.isCustomAdded)
        ];
        if (stallItems.length === 0 && items[idx]) stallItems.push(items[idx]);
        const item = stallItems[0];
        const specialist = roster.find(r => r.stallId === st.id) || roster[idx % roster.length];
        if (!item) return;

        const booth = new THREE.Group();
        booth.position.set(sc.x, 0, sc.z);
        booth.rotation.y = sc.rot;

        const base = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.0, 1.2), darkMat);
        base.position.y = 0.5;
        booth.add(base);

        const top = new THREE.Mesh(new THREE.BoxGeometry(2.95, 0.12, 1.32), accentMat);
        top.position.y = 1.06;
        booth.add(top);

        const countTag = stallItems.length > 1 ? ` (${stallItems.length} items)` : '';
        const signSub = specialist
          ? `${specialist.emoji} ${specialist.employeeName} · $${Number(item.retailPrice).toFixed(2)}${countTag}`
          : `$${Number(item.retailPrice).toFixed(2)}${countTag}`;
        const sign = new THREE.Mesh(
          new THREE.PlaneGeometry(2.6, 0.72),
          new THREE.MeshBasicMaterial({ map: makeSignTex(`${st.icon} ${st.title}`, signSub, custom.accentColor) })
        );
        sign.position.set(0, 2.35, -0.35);
        booth.add(sign);

        const hitMesh = new THREE.Mesh(
          new THREE.BoxGeometry(3.0, 2.7, 1.5),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
        );
        hitMesh.position.y = 1.35;
        hitMesh.userData = { stall: st, stallItems, specialist };
        booth.add(hitMesh);
        clickTargets.push(hitMesh);

        scene.add(booth);
      });

      let drag = false, px = 0, py = 0, dist = 0;
      const keys = {};
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      const onDown = (e) => { drag = true; dist = 0; px = e.clientX; py = e.clientY; };
      const onMove = (e) => {
        if (!drag) return;
        const dx = e.clientX - px, dy = e.clientY - py;
        dist += Math.abs(dx) + Math.abs(dy);
        px = e.clientX; py = e.clientY;
        const off = camTarget.clone().sub(camera.position);
        const r = off.length();
        const th = Math.atan2(off.x, off.z) - dx * 0.005;
        const ph = Math.max(0.25, Math.min(2.85, Math.acos(Math.max(-0.99, Math.min(0.99, off.y / r))) - dy * 0.005));
        camTarget.set(
          camera.position.x + r * Math.sin(ph) * Math.sin(th),
          camera.position.y + r * Math.cos(ph),
          camera.position.z + r * Math.sin(ph) * Math.cos(th)
        );
      };
      const onUp = (e) => {
        drag = false;
        if (dist < 6) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(clickTargets);
          if (hits.length > 0) {
            const { stall, stallItems, specialist } = hits[0].object.userData;
            const box = document.getElementById('store-3d-inspector');
            if (box) {
              box.style.display = 'block';
              box.innerHTML = `
                <div class="flex-between" style="margin-bottom:6px;">
                  <span class="badge badge-indigo">${stall.icon} ${escapeHtml(stall.title)} (${stallItems.length})</span>
                  <button style="border:none;background:none;font-size:1.2rem;font-weight:800;" onclick="this.parentElement.parentElement.style.display='none'">×</button>
                </div>
                ${specialist ? `<div style="font-size:0.76rem;color:#334155;margin-bottom:6px;">${specialist.emoji} <strong>${escapeHtml(specialist.employeeName)}</strong> · ${escapeHtml(specialist.title)}</div>` : ''}
                <div style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;">

          }

      };
      const onKeyDown = (e) => { keys[e.key.toLowerCase()] = true; };
      const onKeyUp = (e) => { keys[e.key.toLowerCase()] = false; };

      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', onDown);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      let goalPos = null, goalTgt = null;
      const animate = (now) => {
        const rafId = requestAnimationFrame(animate);
        if (threeEngine) threeEngine.rafId = rafId;
        if (boothDroneProps) {
          boothDroneProps.update(((now || performance.now()) - boothClockStart) * 0.001);
        }

        if (goalPos && goalTgt) {
          camera.position.lerp(goalPos, 0.1);
          camTarget.lerp(goalTgt, 0.1);
          if (camera.position.distanceTo(goalPos) < 0.08) { goalPos = null; goalTgt = null; }
        } else {
          const fwd = new THREE.Vector3().subVectors(camTarget, camera.position);
          fwd.y = 0;
          if (fwd.lengthSq() > 0.0001) fwd.normalize();
          const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
          const move = new THREE.Vector3();
          if (keys['w'] || keys['arrowup']) move.add(fwd);
          if (keys['s'] || keys['arrowdown']) move.sub(fwd);
          if (keys['d'] || keys['arrowright']) move.add(right);
          if (keys['a'] || keys['arrowleft']) move.sub(right);
          if (move.lengthSq() > 0) {
            move.normalize().multiplyScalar(0.11);
            camera.position.add(move);
            camTarget.add(move);
            camera.position.x = Math.max(-6.4, Math.min(6.4, camera.position.x));
            camera.position.z = Math.max(-7.5, Math.min(8.6, camera.position.z));
          }
        }
        camera.lookAt(camTarget);
        renderer.render(scene, camera);
      };

      threeEngine = {
        rafId: null,
        teleportTo(pos, tgt) {
          goalPos = new THREE.Vector3(...pos);
          goalTgt = new THREE.Vector3(...tgt);

        cleanup() {
          dom.removeEventListener('pointerdown', onDown);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('keyup', onKeyUp);

        const modalBody = document.getElementById('studio-modal-body');
        if (modalBody) modalBody.innerHTML = renderStudioBody();
        if (currentView === 'store' || currentView === 'manager-dashboard') render();
      },
      toggleJobProfileAccordion(empId) {
        expandedJobProfileId = (expandedJobProfileId === empId) ? null : empId;
        render();
      },
      addNewAccordionRole() {
        const roster = getStoreStaff(currentStoreId);
        const store = STORE_CATEGORIES.find(s => s.id === currentStoreId);
        const newId = 'emp_' + Date.now();
        const newRole = {
          id: newId,
          employeeName: 'New Team Specialist',
          title: 'Customer Experience & Operations Rep',
          roleKey: 'salesperson',
          stallId: 'reception',
          hourlyRate: 20.00,
          shiftHours: 6,
          emoji: '🧑‍💼',
          jobDescription: `Supports front-desk operations, customer live chat, and POS checkout for ${store ? store.name : 'the storefront'}.`
        };
        saveStoreStaff(currentStoreId, [...roster, newRole]);
        expandedJobProfileId = newId;
        showToast('Added new editable role profile');
        render();
      },
      async handleProductVideoUpload(files) {
        try {
          const count = await saveProductVideoFiles(currentStoreId, files);
          if (count > 0) {
            showToast(`Saved ${count} video(s) to IndexedDB showcase!`);
            await refreshStudioProductVideoList(currentStoreId);
            if (currentView === 'store') initProductVideoShowcase(currentStoreId);
          } else {
            showToast('Please select .mp4, .webm, or .mov video files.');
          }
        } catch (err) {
          showToast('Video upload error: ' + (err && err.message ? err.message : 'Unable to store video'));
        }
      },
      async addDirectProductVideoUrl() {
        const urlEl = document.getElementById('direct-product-video-url');
        const titleEl = document.getElementById('direct-product-video-title');
        const url = (urlEl ? urlEl.value : '').trim();
        if (!url) {
          showToast('Enter a valid video URL (.mp4 / .webm / .mov)');
          return;
        }
        const custom = getStoreCustomization(currentStoreId);
        const existing = Array.isArray(custom.productShowcaseUrls) ? custom.productShowcaseUrls : [];
        saveStoreCustomization(currentStoreId, {
          productShowcaseUrls: [
            ...existing,
            {
              id: 'url_' + Date.now(),
              title: (titleEl ? titleEl.value : '').trim() || `Product Video #${existing.length + 1}`,
              url
            }
          ]
        });
        if (urlEl) urlEl.value = '';
        if (titleEl) titleEl.value = '';
        showToast('Added direct video URL to showcase playlist!');
        await refreshStudioProductVideoList(currentStoreId);
        if (currentView === 'store') initProductVideoShowcase(currentStoreId);
      },
      async removeProductVideo(itemId, sourceKind) {
        await deleteProductVideoItem(currentStoreId, itemId, sourceKind);
        showToast('Removed video from showcase playlist');
        await refreshStudioProductVideoList(currentStoreId);
        if (currentView === 'store') initProductVideoShowcase(currentStoreId);
      },
      selectProductShowcaseClip(idx) {
        const playlist = window.__productPlaylist || [];
        if (!playlist.length) return;
        const vid = document.getElementById('product-showcase-video');
        const titleEl = document.getElementById('product-showcase-active-title');
        const pillsEl = document.getElementById('product-showcase-pills');
        const safeIdx = ((idx % playlist.length) + playlist.length) % playlist.length;
        window.__productPlaylistIdx = safeIdx;
        const item = playlist[safeIdx];
        if (vid) {
          vid.src = item.src;
          vid.loop = playlist.length === 1;
          vid.play().catch(() => {});
        }
        if (titleEl) {
          titleEl.textContent = `${item.name} (${safeIdx + 1} of ${playlist.length} · Continuous Loop)`;
        }
        if (pillsEl) {
          pillsEl.innerHTML = playlist.map((p, i) => `
            <button class="btn ${i === safeIdx ? 'btn-amber' : 'btn-dark'}" style="padding:4px 10px;font-size:0.74rem;"
              onclick="window.__app.selectProductShowcaseClip(${i})">
              ${i === safeIdx ? '▶' : '🎞️'} ${escapeHtml(p.name)}
            </button>
          `).join('');
        }
      },
      toggleProductShowcasePlay() {
        const vid = document.getElementById('product-showcase-video');
        const btn = document.getElementById('product-showcase-play-btn');
        if (!vid || vid.style.display === 'none') return;
        if (vid.paused) {
          vid.play().catch(() => {});
          if (btn) btn.textContent = '⏸ Pause';
        } else {
          vid.pause();
          if (btn) btn.textContent = '▶ Play';
        }
      },
      toggleProductShowcaseMute() {
        const vid = document.getElementById('product-showcase-video');
        const btn = document.getElementById('product-showcase-mute-btn');
        if (!vid) return;
        vid.muted = !vid.muted;
        if (btn) btn.textContent = vid.muted ? '🔇 Unmute' : '🔊 Mute';
      },
      fullscreenProductShowcase() {
        const stage = document.getElementById('product-showcase-stage');
        if (stage && stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
      },
      resetDefaultRoster() {
        saveStoreStaff(currentStoreId, JSON.parse(JSON.stringify(STORE_DEFAULT_ROSTER[currentStoreId] || [])));
        showToast('Restored default diverse team roster');
        document.getElementById('studio-modal-body').innerHTML = renderStudioBody();
        if (currentView === 'store') render();
      },
      addBomLine(backendId, form) {
        const item = allData.find(d => d.__backendId === backendId);
        if (!item) return;
        const bom = Array.isArray(item.bom) ? [...item.bom] : [];
        bom.push({
          material: form.material.value.trim(),
          qty: Number(form.qty.value) || 1,
          unitCost: Number(form.unitCost.value) || 0
        });
        const newCost = bom.reduce((s, l) => s + (Number(l.qty) * Number(l.unitCost)), 0);
        dbUpdate({ ...item, bom, costPrice: Number(newCost.toFixed(2)) });
        showToast('Added BOM material & updated unit cost');
        document.getElementById('studio-modal-body').innerHTML = renderStudioBody();
      },
      removeBomLine(backendId, lineIdx) {
        const item = allData.find(d => d.__backendId === backendId);
        if (!item || !Array.isArray(item.bom)) return;
        const bom = item.bom.filter((_, idx) => idx !== lineIdx);
        const newCost = bom.reduce((s, l) => s + (Number(l.qty) * Number(l.unitCost)), 0);
        dbUpdate({ ...item, bom, costPrice: Number(newCost.toFixed(2)) });
        document.getElementById('studio-modal-body').innerHTML = renderStudioBody();
      },
      addMenuItem() {
        const store = STORE_CATEGORIES.find(s => s.id === currentStoreId);
        const stallId = document.getElementById('nm-stall').value;
        const stall = store.stalls.find(s => s.id === stallId) || store.stalls[0];
        const cost = Number(document.getElementById('nm-cost').value) || 0;
        const price = Number(document.getElementById('nm-price').value) || 0;
        const name = document.getElementById('nm-name').value.trim();
        const desc = document.getElementById('nm-desc').value.trim();
        const offeringType = document.getElementById('nm-type').value;
        const img = document.getElementById('nm-img').value.trim() || store.storeImage;
        const veiBuyUrl = document.getElementById('nm-veibuy')?.value.trim() || '';
        const salonGroupMap = {
          shampoo: 'Hair Services',
          styling: 'Hair Services',
          nail: 'Nail Services',
          vanity: 'Beauty Services',
          reception: 'Beauty Services'
        };
        dbCreate({
          type: 'inventory',
          category: String(currentStoreId),
          name,
          description: desc,
          offeringType,
          categoryGroup: store.isSalon ? (salonGroupMap[stallId] || 'Beauty Services') : '',
          stallId,
          station: stall.title,
          imageUrl: img,
          veiBuyUrl,
          costPrice: cost,
          retailPrice: price,
          bom: [{ material: `${name} Supply Kit`, qty: 1, unitCost: cost }],
          unitsSold: 0,
          isCustomAdded: true
        });
        const targetRoomIdx = (STORE_PHOTO_SKINS[currentStoreId] || []).findIndex(s => s.stallId === stallId);
        if (targetRoomIdx >= 0) salonStationIdx = targetRoomIdx;
        salonStylingPage = 0;
        showToast(`Published "${name}" to ${stall.title}`);
        const modalBody = document.getElementById('studio-modal-body');
        if (modalBody) modalBody.innerHTML = renderStudioBody();
        if (currentView === 'store') render();
      },
      toggleEditItem(backendId) {
        const box = document.getElementById(`edit-box-${backendId}`);
        if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
      },
      saveEditedItem(backendId) {
        const item = allData.find(d => d.__backendId === backendId);
        if (!item) return;
        const store = STORE_CATEGORIES.find(s => s.id === currentStoreId);
        const stallId = document.getElementById(`ed-stall-${backendId}`)?.value || item.stallId;
        const stall = store.stalls.find(s => s.id === stallId) || store.stalls[0];
        const nextPrice = Number(document.getElementById(`ed-price-${backendId}`)?.value);
        const veiBuyInput = document.getElementById(`ed-veibuy-${backendId}`);
        dbUpdate({
          ...item,
          name: document.getElementById(`ed-name-${backendId}`)?.value.trim() || item.name,
          description: document.getElementById(`ed-desc-${backendId}`)?.value.trim() || item.description,
          imageUrl: document.getElementById(`ed-img-${backendId}`)?.value.trim() || item.imageUrl,
          veiBuyUrl: veiBuyInput ? veiBuyInput.value.trim() : (item.veiBuyUrl || ''),
          stallId,
          station: stall.title,
          retailPrice: !isNaN(nextPrice) && nextPrice >= 0 ? nextPrice : item.retailPrice,
          priceDisplay: '',
          isCustomAdded: true
        });
        const skins = STORE_PHOTO_SKINS[currentStoreId] || [];
        const targetRoomIdx = skins.findIndex(s => s.stallId === stallId);
        if (targetRoomIdx >= 0) salonStationIdx = targetRoomIdx;
        showToast('Saved offering & synced 360° storefront!');
        const modalBody = document.getElementById('studio-modal-body');
        if (modalBody) modalBody.innerHTML = renderStudioBody();
        if (currentView === 'store') render();
      },
      deleteItem(backendId) {
        const item = allData.find(d => d.__backendId === backendId);
        if (!item) return;
        dbDelete(item);
        showToast('Removed from menu');
        document.getElementById('studio-modal-body').innerHTML = renderStudioBody();
        if (currentView === 'store') render();
      },
      saveDesign() {
        saveStoreCustomization(currentStoreId, {
          videoSourceType: document.getElementById('cust-vid-type').value,
          videoUrl: document.getElementById('cust-vid-url').value.trim(),
          videoTitle: document.getElementById('cust-vid-title').value.trim(),
          greetingMessage: document.getElementById('cust-msg').value.trim(),
          wallColor: document.getElementById('cust-wall').value,
          accentColor: document.getElementById('cust-accent').value,
          greetingHeadline: document.getElementById('cust-headline').value.trim()
        });
        showToast('Saved showreel & storefront theme!');
        if (currentView === 'store') render();
      },
      chooseManagerStore(id) {
        currentStoreId = id;
        ensureStoreInventory(id);
        currentView = 'manager-login';
        render();
      },
      loginWithStaff(empId) {
        activeStaffId = empId;
        const roster = getStoreStaff(currentStoreId);
        const emp = roster.find(r => r.id === empId);
        showToast(`Signed in as ${emp ? `${emp.emoji} ${emp.employeeName}` : 'Team Member'}`);
        currentView = 'manager-dashboard';
        render();
      },
      logout() {
        customerName = '';
        basketItems = [];
        currentStoreId = null;
        activeStaffId = null;
        chatOpen = false;
        currentView = 'landing';
        render();
      }
    };

    window.onThreeLoaded = function() {
      if (currentView === 'store' && storeViewMode !== 'menu-only') {
        if (salonRenderStyle === 'photo360') {
          initPhotographicStore3DScene(currentStoreId);
        } else {
          initStore3DScene(currentStoreId);
        }
      }
    };

    render();
  })();

  </script>
</body>
</html>
